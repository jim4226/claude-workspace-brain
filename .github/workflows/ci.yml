name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    name: install + lint on ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install into a throwaway target dir
        shell: bash
        run: |
          mkdir -p /tmp/target
          python _install.py --target /tmp/target --yes

      - name: Verify all installer files landed
        shell: bash
        run: |
          for f in \
            .claude/settings.json \
            .claude/hooks/brain_session_start.py \
            .claude/hooks/brain_pre_compact.py \
            .claude/hooks/brain_stop.py \
            .claude/hooks/brain_loop_runner.py \
            .claude/commands/brain.md \
            .claude/commands/brain-grade.md \
            .claude/commands/brain-init.md \
            .claude/commands/brain-archive.md \
            .claude/commands/user-research.md \
            .claude/commands/loop-init.md \
            .claude/commands/loop-run.md \
            .claude/commands/loop-tune.md \
            .claude/commands/loop.md \
            .claude/scripts/brain_lint.py \
            WORKSPACE_BRAIN.md; do
            test -f "/tmp/target/$f" || { echo "missing: $f"; exit 1; }
          done

      - name: Run linter on the installed template
        shell: bash
        run: |
          cd /tmp/target
          python .claude/scripts/brain_lint.py

      - name: Verify SessionStart hook produces non-empty stdout
        shell: bash
        run: |
          cd /tmp/target
          out=$(python .claude/hooks/brain_session_start.py)
          echo "$out" | grep -q "WORKSPACE BRAIN" || { echo "hook output missing header"; exit 1; }

      - name: Verify PreCompact hook produces directive
        shell: bash
        run: |
          cd /tmp/target
          out=$(echo '{}' | python .claude/hooks/brain_pre_compact.py)
          echo "$out" | grep -q "PRE-COMPACTION DIRECTIVE" || { echo "hook output missing directive"; exit 1; }

      - name: Verify loop runner exits cleanly when no loops file present
        shell: bash
        run: |
          cd /tmp/target
          python .claude/hooks/brain_loop_runner.py
          # Should exit 0 with no output when WORKSPACE_LOOPS.md doesn't exist

      - name: Verify loop runner emits directive when a loops file with due loop exists
        shell: bash
        run: |
          cd /tmp/target
          cat > WORKSPACE_LOOPS.md <<'EOF'
          # WORKSPACE LOOPS
          ## LOOP: test-loop
          - **Goal**: smoke-test the runner
          - **Trigger**: every 1d
          - **Next run**: 2020-01-01
          - **Observation**: `echo ok`
          - **Criterion**: exit_code == 0
          - **Brain context**: DECISIONS LOG
          - **Status**: active
          ### History
          ### Tuning Log
          EOF
          out=$(python .claude/hooks/brain_loop_runner.py)
          echo "$out" | grep -q "LOOPS DUE" || { echo "loop runner missed due loop"; exit 1; }
          echo "$out" | grep -q "test-loop" || { echo "loop runner missing slug"; exit 1; }
          rm -f WORKSPACE_LOOPS.md .claude/.loops-runner-state

      - name: Re-run installer (should be idempotent)
        shell: bash
        run: |
          python _install.py --target /tmp/target --yes
